name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: npm test

      - name: Build the extension package
        run: npm run build

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: lyric-tap-unpacked
          path: dist/*.zip
          if-no-files-found: error
