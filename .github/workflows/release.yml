name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: npm test

      - name: Build the extension package
        run: npm run build

      - name: Check the tag matches the manifest version
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          manifest=$(node -p "require('./extension/manifest.json').version")
          if [ "$tag" != "v$manifest" ]; then
            echo "Tag $tag does not match manifest version $manifest" >&2
            exit 1
          fi
          echo "version=$manifest" >> "$GITHUB_ENV"
          echo "tag=$tag" >> "$GITHUB_ENV"

      - name: Pull the notes for this version out of the changelog
        run: |
          awk -v version="$version" '
            $0 ~ "^## \\[?" version "\\]?" { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No changelog entry found for $version" >&2
            exit 1
          fi
          cat release-notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$tag" \
            "dist/lyric-tap-v$version.zip" \
            --title "Lyric Tap $tag" \
            --notes-file release-notes.md
