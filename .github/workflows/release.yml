name: Release

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

# Publishing a release from the web UI fires twice: `push` for the tag it
# creates, and `release` for the publication itself. Both triggers are kept so
# either route works, but they must not reach the publish step together — one
# would create the release while the other collided with it. Queue rather than
# cancel, so the second run attaches the package to what the first produced and
# both finish green.
concurrency:
  group: release-${{ github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Work out which tag is being released
        run: |
          tag="${{ github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}"
          if [ -z "$tag" ]; then
            echo "Could not determine a tag to release" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: npm test

      - name: Build the extension package
        run: npm run build

      - name: Check the tag matches the manifest version
        run: |
          manifest=$(node -p "require('./extension/manifest.json').version")
          if [ "$tag" != "v$manifest" ]; then
            echo "Tag $tag does not match manifest version $manifest" >&2
            exit 1
          fi
          echo "version=$manifest" >> "$GITHUB_ENV"

      - name: Pull the notes for this version out of the changelog
        run: |
          awk -v version="$version" '
            $0 ~ "^## \\[?" version "\\]?" { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No changelog entry found for $version" >&2
            exit 1
          fi
          cat release-notes.md

      # The release may already exist — someone can draft and publish one from
      # the web UI, which is also what creates the tag. In that case attach the
      # built package to it rather than failing on a duplicate.
      - name: Publish the release, or attach to the existing one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="dist/lyric-tap-v$version.zip"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag exists; uploading the package to it."
            gh release upload "$tag" "$asset" --clobber
          else
            echo "Creating release $tag."
            gh release create "$tag" "$asset" \
              --title "Lyric Tap $tag" \
              --notes-file release-notes.md
          fi

          gh release view "$tag" --json tagName,assets \
            --jq '.tagName + " — assets: " + ([.assets[].name] | join(", "))'
